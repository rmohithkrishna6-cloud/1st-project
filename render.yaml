# Render Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: nexora-postgres
    databaseName: nexoradb
    user: nexora
    plan: free
    ipAllowList: [] # Restrict to internal connections within Render

services:
  # Managed Redis (Key-Value Store)
  - type: keyvalue
    name: nexora-redis
    plan: free
    ipAllowList: [] # Restrict to internal connections within Render
    maxmemoryPolicy: allkeys-lru

  # Nexora Backend API
  - type: web
    name: nexora-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build && npx prisma db push
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # Auto-linked internal connection string from Render PostgreSQL
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-postgres
          property: connectionString

      # Auto-linked internal connection string from Render Key-Value (Redis)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nexora-redis
          property: connectionString

      # Cryptographically secure 256-bit key automatically generated by Render
      - key: JWT_SECRET
        generateValue: true

      # Sandboxed Execution Engine (Piston Public API)
      - key: PISTON_URL
        value: https://emkc.org/api/v2/piston

      - key: EXECUTION_ENGINE
        value: piston

      # CORS Allowed Origins: replace placeholder with your actual Vercel domain
      - key: ALLOWED_ORIGINS
        value: https://your-nexora-app.vercel.app,http://localhost:5173
