<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="bracketLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#efe6dd" />
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a0002" />
      <stop offset="50%" stop-color="#ff2a2e" />
      <stop offset="100%" stop-color="#efe6dd" />
    </linearGradient>
    <linearGradient id="bracketRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b3e" />
      <stop offset="100%" stop-color="#9a0002" />
    </linearGradient>
    <filter id="accentDotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Bracket < -->
  <path d="M 12 11 L 4 20 L 12 29" stroke="url(#bracketLeftGrad)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Slash / -->
  <path d="M 23 9 L 15 31" stroke="url(#slashGrad)" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Right Bracket > -->
  <path d="M 26 11 L 34 20 L 26 29" stroke="url(#bracketRightGrad)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Accent Dot . -->
  <circle cx="36" cy="31" r="2.6" fill="#ff2a2e" filter="url(#accentDotGlow)"/>
  <circle cx="36" cy="31" r="1.3" fill="#efe6dd"/>
</svg>
