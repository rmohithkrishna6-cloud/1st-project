<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121620" />
      <stop offset="100%" stop-color="#080A0F" />
    </linearGradient>
    <linearGradient id="bracketLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4F7FB" />
    </linearGradient>
    <linearGradient id="slash" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5A1F" />
      <stop offset="60%" stop-color="#FF304F" />
      <stop offset="100%" stop-color="#F4F7FB" />
    </linearGradient>
    <linearGradient id="bracketRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A1F" />
      <stop offset="100%" stop-color="#FF304F" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with Codeticz Orange border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#FF5A1F" stroke-width="2" stroke-opacity="0.85"/>

  <!-- Left Bracket < -->
  <path d="M 20 18 L 8 32 L 20 46" stroke="url(#bracketLeft)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Slash / -->
  <path d="M 37 14 L 25 50" stroke="url(#slash)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Right Bracket > -->
  <path d="M 42 18 L 54 32 L 42 46" stroke="url(#bracketRight)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Accent Dot . -->
  <circle cx="56" cy="48" r="4.5" fill="#FF5A1F"/>
  <circle cx="56" cy="48" r="2" fill="#F4F7FB"/>
</svg>
